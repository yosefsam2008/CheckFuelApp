<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>CheckFuel — באנר חנות</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#40D63C}a:hover{color:#7BEAAE}
</style>
</helmet>
<div dir="rtl" style="width: 1024px; height: 500px; box-sizing: border-box; background: #0B1410; font-family: Rubik, system-ui, sans-serif; color: #FFFFFF; display: flex; align-items: center; gap: 48px; padding: 0 64px; overflow: hidden; position: relative">

  <!-- copy -->
  <div style="flex: 1; display: flex; flex-direction: column; gap: 22px; position: relative; z-index: 1">
    <div dir="ltr" role="img" aria-label="Checkfuel" style="display: flex; align-items: flex-end; justify-content: flex-end">
      <img src="/_blob/9d5d365ca5014f0a4ae73ad1b56c5f7a" alt="" style="width: 35px; height: 35px; margin: 0 -2px 2px 0">
      <span style="font-size: 32px; letter-spacing: -0.02em; font-weight: 500; line-height: 1">heck<span style="font-weight: 700; color: #40D63C">fuel</span></span>
    </div>
    <h1 style="margin: 0; font-size: 54px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em">יודעים כמה עולה<br>הנסיעה. <span style="color: #40D63C">לפני שיוצאים.</span></h1>
    <p style="margin: 0; font-size: 20px; line-height: 1.45; color: #DCE5E0; max-width: 440px">מכניסים יעד, מקבלים מחיר דלק לפי הרכב שלכם, ומחלקים בין החברים בלחיצה.</p>
    <span style="align-self: flex-start; height: 48px; padding: 0 24px; border-radius: 24px; background: #40D63C; color: #0B1410; font-size: 18px; font-weight: 700; display: flex; align-items: center">חינם להורדה</span>
  </div>

  <!-- receipt card -->
  <div style="width: 340px; flex-shrink: 0; position: relative; z-index: 1; transform: rotate(-4deg)">
    <div style="background: #FFFFFF; color: #0B1410; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 3px">
          <span style="width: 10px; height: 10px; border-radius: 6px; border: 3px solid #0A7A43; display: block"></span>
          <span style="width: 0; height: 18px; border-right: 2px dashed #C9D2CA; display: block"></span>
          <span style="width: 10px; height: 10px; border-radius: 3px; background: #0B1410; display: block"></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; font-size: 16px; font-weight: 600"><span>תל אביב</span><span>אילת</span></div>
        <span style="margin-right: auto; height: 28px; padding: 0 10px; border-radius: 14px; background: #F3F5F1; font-size: 12px; color: #5B6660; display: flex; align-items: center">הלוך-חזור</span>
      </div>
      <div style="height: 1px; background: #EEF1EC"></div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #5B6660">עלות דלק</span>
        <span style="font-size: 56px; font-weight: 800; line-height: 1; letter-spacing: -0.03em"><span style="color: #0A7A43; font-size: 34px">₪</span>377</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; background: #0B1410; color: #FFFFFF; border-radius: 16px; padding: 12px 14px">
        <span style="font-size: 14px; color: #DCE5E0">3 נוסעים</span>
        <span style="font-size: 22px; font-weight: 800; color: #40D63C">₪126 לכל אחד</span>
      </div>
    </div>
  </div>

  <!-- decor: oversized mark -->
  <img src="/_blob/9d5d365ca5014f0a4ae73ad1b56c5f7a" alt="" style="position: absolute; left: -140px; top: -40px; width: 580px; height: 580px; opacity: 0.06">
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":500}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
