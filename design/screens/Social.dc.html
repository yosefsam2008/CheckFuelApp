<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>CheckFuel — מודעה חברתית</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B1410}a:hover{color:#22302A}
</style>
</helmet>
<div dir="rtl" style="width: 1080px; height: 1080px; box-sizing: border-box; background: {{bg}}; font-family: Rubik, system-ui, sans-serif; color: #0B1410; display: flex; flex-direction: column; justify-content: space-between; padding: 80px">

  <div dir="ltr" role="img" aria-label="Checkfuel" style="align-self: flex-end; display: flex; align-items: flex-end; color: #0B1410">
    <img src="/_blob/46285c9cbcdc83a2ec672f1fc7324c25" alt="" style="width: 58px; height: 58px; margin: 0 -3px 3px 0">
    <span style="font-size: 54px; letter-spacing: -0.02em; font-weight: 500; line-height: 1">heck<span style="font-weight: 700">fuel</span></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 300px; font-weight: 800; line-height: 0.9; letter-spacing: -0.05em"><span style="font-size: 170px">₪</span>126</span>
    <span style="font-size: 76px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em">לכל אחד.</span>
    <span style="font-size: 40px; font-weight: 500; line-height: 1.3; margin-top: 12px">אילת, הלוך-חזור, 3 חברים.<br>ידעתם את המחיר לפני שיצאתם.</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <span style="font-size: 30px; font-weight: 500">מחשבון דלק לנסיעות</span>
    <span style="height: 88px; padding: 0 44px; border-radius: 44px; background: #0B1410; color: {{bg}}; font-size: 34px; font-weight: 700; display: flex; align-items: center">הורידו בחינם</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#40D63C","options":["#40D63C","#FFFFFF","#F3F5F1","#B8F5D2"]},"$preview":{"width":1080,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return { bg: this.props.bg ?? '#40D63C' }; }
}
</script>
</body>
</html>
